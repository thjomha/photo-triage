name = "photo-triage"
main = "src/index.js"
compatibility_date = "2025-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "photo-triage"
database_id = "647dd103-a778-4ae9-ada3-0916e14751c9"

[vars]
# Public hostname of your tunnel, e.g. https://photos-api.example.com
LAN_API_URL = "https://photos.tahajomha.com"

# Secrets (set with `wrangler secret put`):
#   LAN_API_TOKEN            required, must match API_TOKEN on the LAN API
#   CF_ACCESS_CLIENT_ID      optional, if the tunnel hostname is behind Cloudflare Access
#   CF_ACCESS_CLIENT_SECRET  optional
