<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Triage</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2c313a; --text:#e8eaee; --dim:#8b93a1;
          --keep:#2fa66a; --del:#d64550; --accent:#5b8def; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font:16px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; border:1px solid var(--line);
           background:var(--panel); border-radius:10px; padding:10px 16px; }
  button:hover { border-color:var(--dim); }
  button:disabled { opacity:.4; cursor:default; }
  .primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  #app { max-width:760px; margin:0 auto; padding:16px; min-height:100%; }
  .crumbs { display:flex; flex-wrap:wrap; gap:4px; align-items:center; color:var(--dim); margin-bottom:14px; }
  .crumbs a { color:var(--accent); cursor:pointer; text-decoration:none; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .list { display:flex; flex-direction:column; gap:6px; }
  .row { display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--panel);
         border:1px solid var(--line); border-radius:10px; cursor:pointer; }
  .row:hover { border-color:var(--dim); }
  .row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  .badge.done { color:var(--keep); border-color:var(--keep); }
  .badge.partial { color:#e0a63a; border-color:#e0a63a; }
  .badge.new { color:var(--accent); border-color:var(--accent); }
  .muted { color:var(--dim); }
  .err { background:#3a1c20; border:1px solid var(--del); padding:10px 14px; border-radius:10px; margin-bottom:12px; }
  /* review */
  #review { position:fixed; inset:0; display:flex; flex-direction:column; background:#000; touch-action:pan-y; }
  #review header { display:flex; justify-content:space-between; align-items:center; gap:10px;
                   padding:calc(10px + env(safe-area-inset-top)) 14px 10px; color:var(--dim); font-size:14px; }
  #review header .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative; }
  #stage img { max-width:100%; max-height:100%; object-fit:contain; transition:transform .15s, opacity .15s; }
  #stage .fname { position:absolute; bottom:8px; left:0; right:0; text-align:center; font-size:12px; color:var(--dim);
                  text-shadow:0 1px 3px #000; pointer-events:none; }
  #stage .flash { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .2s; }
  #actions { display:flex; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); }
  #actions button { flex:1; padding:16px 10px; font-size:18px; font-weight:600; border:0; }
  #actions .del { background:var(--del); } #actions .keep { background:var(--keep); }
  #actions .undo { flex:0 0 64px; background:var(--panel); font-weight:400; }
  .center { text-align:center; padding:60px 20px; }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#3a1c20; border:1px solid var(--del);
           padding:10px 16px; border-radius:10px; z-index:10; display:none; max-width:90%; }
  .hint { font-size:12px; color:var(--dim); text-align:center; padding-bottom:6px; }
  @media (hover:none) { .hint.kbd { display:none; } }
  .note { background:#1f2a3d; border:1px solid #33496d; color:#b9c8e3; padding:8px 12px; border-radius:10px;
          font-size:13px; margin-bottom:12px; }
  .small { font-size:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:16px; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:8px 0; cursor:pointer; }
  .opt input { margin-top:4px; }
  input[type=text], input:not([type]) { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line);
          border-radius:8px; padding:9px 12px; min-width:0; flex:1 1 160px; }
  code { background:var(--bg); padding:1px 5px; border-radius:4px; }
  .mrow { display:flex; align-items:center; gap:12px; padding:8px; background:var(--panel);
          border:1px solid var(--line); border-radius:10px; margin-bottom:6px; }
  .mrow img { width:64px; height:64px; object-fit:cover; border-radius:6px; background:#000; display:block; }
  .minfo { flex:1; min-width:0; }
  .mname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .minfo .muted { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
const $app = document.getElementById('app');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(p, opts) {
  const r = await fetch('/api/' + p, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Request failed (' + r.status + ')');
  return j;
}
const post = (p, body) => api(p, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) });
const q = (path) => 'path=' + encodeURIComponent(path);
const imgUrl = (p) => '/api/img?w=1800&' + q(p);

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = 'none'), 4000);
}

/* ---------- routing: #browse:<path> or #review:<path> ---------- */
let CONFIG = { deleteMode: 'mark' };
const configP = api('config').then((c) => (CONFIG = c)).catch(() => CONFIG);
const markMode = () => CONFIG.deleteMode !== 'move';

function go(mode, path) { location.hash = mode + ':' + encodeURIComponent(path); }
window.addEventListener('hashchange', route);
function route() {
  const m = /^#(browse|review|marked|settings):(.*)$/.exec(location.hash);
  const mode = m ? m[1] : 'browse';
  const path = m ? decodeURIComponent(m[2]) : '';
  configP.then(() => ({ review: reviewView, marked: markedView, settings: settingsView }[mode] || browseView)(path));
}

/* ---------- browse ---------- */
const badge = (f) => {
  if (f.status === 'done') return '<span class="badge done">✓ done</span>';
  if (f.status === 'partial') return `<span class="badge partial">${f.kept + f.deleted}/${f.photoCount + f.deleted - f.marked} reviewed</span>`;
  if (f.status === 'new') return `<span class="badge new">${f.photoCount} new</span>`;
  if (f.reviewedInside) return `<span class="badge partial">${f.reviewedInside} reviewed inside</span>`;
  return '';
};

async function browseView(path) {
  cleanupReview();
  $app.innerHTML = '<p class="muted">Loading…</p>';
  try {
    const [d, resume] = await Promise.all([api('folders?' + q(path)), api('resume')]);
    const parts = path ? path.split('/') : [];
    let acc = '';
    const crumbs = ['<a data-p="">Root</a>'].concat(parts.map((p) => {
      acc += (acc ? '/' : '') + p; return `<span>/</span><a data-p="${esc(acc)}">${esc(p)}</a>`;
    }));
    const pending = d.photoCount - d.kept - d.marked;
    let html = '';
    if (markMode()) html += '<div class="note">Mark-only mode: “delete” just adds a photo to the delete list. Nothing is removed from the drive.</div>';
    html += `<div class="crumbs">${crumbs.join('')}</div><div class="bar">`;
    if (resume.folder !== null && resume.folder !== path)
      html += `<button class="primary" id="resume">↩ Resume: ${esc(resume.folder || 'Root')}</button>`;
    if (d.photoCount > 0)
      html += pending > 0
        ? `<button class="primary" id="start">Review ${pending} photo${pending === 1 ? '' : 's'} here</button>`
        : `<span class="badge done">✓ all photos in this folder reviewed</span>`;
    html += `<button id="dellist">🗑 Delete list (${d.deleteListTotal})</button>`;
    if (path) html += '<button id="dellist-here">This folder’s list</button>';
    html += '<button id="settings" title="Settings">⚙ Settings</button>';
    html += '</div>';
    html += d.folders.length
      ? '<div class="list">' + d.folders.map((f) =>
          `<div class="row" data-p="${esc(f.path)}"><span class="name">📁 ${esc(f.name)}</span>${badge(f)}</div>`).join('') + '</div>'
      : '<p class="muted">No subfolders.</p>';
    $app.innerHTML = html;
    $app.querySelectorAll('[data-p]').forEach((el) => el.addEventListener('click', () => go('browse', el.dataset.p)));
    $app.querySelector('#start')?.addEventListener('click', () => go('review', path));
    $app.querySelector('#resume')?.addEventListener('click', () => go('review', resume.folder));
    $app.querySelector('#dellist')?.addEventListener('click', () => go('marked', ''));
    $app.querySelector('#dellist-here')?.addEventListener('click', () => go('marked', path));
    $app.querySelector('#settings')?.addEventListener('click', () => go('settings', ''));
  } catch (e) {
    $app.innerHTML = `<div class="err">${esc(e.message)}</div><button onclick="route()">Retry</button>`;
  }
}

/* ---------- review ---------- */
let R = null; // review state

function cleanupReview() {
  if (R) { window.removeEventListener('keydown', R.onKey); R = null; }
}

async function reviewView(path) {
  cleanupReview();
  $app.innerHTML = '<p class="muted">Loading…</p>';
  let d;
  try { d = await api('photos?' + q(path)); }
  catch (e) { $app.innerHTML = `<div class="err">${esc(e.message)}</div><button onclick="history.back()">Back</button>`; return; }

  R = { path, queue: d.pending.slice(), history: [], kept: d.kept, deleted: d.deleted, chain: Promise.resolve(), busy: false };
  R.onKey = (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'k') decide('keep');
    else if (e.key === 'ArrowLeft' || e.key === 'd' || e.key === 'Delete') decide('delete');
    else if (e.key === 'z' || e.key === 'Backspace') undo();
    else if (e.key === 'Escape') leave();
  };
  window.addEventListener('keydown', R.onKey);
  renderReview();
}

function leave() { go('browse', R ? R.path : ''); }

function renderReview() {
  const left = R.queue.length;
  const title = R.path || 'Root';
  $app.innerHTML = `
    <div id="review">
      <header><button id="back">← Folders</button><span class="t">${esc(title)}</span><span>${left} left</span></header>
      <div id="stage"></div>
      <div class="hint kbd">→ / K keep · ← / D delete · Z undo · Esc back &nbsp;|&nbsp; swipe right = keep, left = delete</div>
      ${markMode() ? '<div class="hint">Deleting only marks the photo. Nothing is removed from the drive.</div>' : ''}
      <div id="actions">
        <button class="undo" id="undo" title="Undo (Z)">↶</button>
        <button class="del" id="del">${markMode() ? '🗑 Mark delete' : '🗑 Delete'}</button>
        <button class="keep" id="keep">✓ Keep</button>
      </div>
    </div>`;
  document.getElementById('back').onclick = leave;
  document.getElementById('del').onclick = () => decide('delete');
  document.getElementById('keep').onclick = () => decide('keep');
  document.getElementById('undo').onclick = undo;
  attachSwipe(document.getElementById('stage'));
  showCurrent();
}

function showCurrent() {
  const stage = document.getElementById('stage');
  if (!stage) return;
  const hdr = document.querySelector('#review header span:last-child');
  if (hdr) hdr.textContent = R.queue.length + ' left';
  document.getElementById('undo').disabled = R.history.length === 0;

  if (R.queue.length === 0) {
    stage.innerHTML = `<div class="center"><h2>Folder done ✓</h2>
      <p class="muted">${R.kept} kept · ${R.deleted} deleted</p>
      <button class="primary" id="finish">Back to folders</button></div>`;
    document.getElementById('finish').onclick = leave;
    document.getElementById('keep').disabled = document.getElementById('del').disabled = true;
    return;
  }
  document.getElementById('keep').disabled = document.getElementById('del').disabled = false;
  const cur = R.queue[0];
  stage.innerHTML = `<img alt="" src="${imgUrl(cur)}"><div class="fname">${esc(cur.split('/').pop())}</div>`;
  const img = stage.querySelector('img');
  img.onerror = () => toast('Could not load this image. Press the key again to skip it, or reload.');
  R.queue.slice(1, 4).forEach((p) => { new Image().src = imgUrl(p); }); // preload next few
}

// Optimistic: advance immediately, sync with the server in order in the background.
function decide(decision) {
  if (!R || R.queue.length === 0) return;
  const p = R.queue.shift();
  R.history.push({ path: p, decision });
  decision === 'keep' ? R.kept++ : R.deleted++;
  const state = R;
  state.chain = state.chain.then(() => post('decide', { path: p, decision })).catch((e) => {
    toast('Failed to save ' + p.split('/').pop() + ': ' + e.message);
    // put it back so nothing is silently lost
    const i = state.history.findIndex((h) => h.path === p);
    if (i >= 0) state.history.splice(i, 1);
    decision === 'keep' ? state.kept-- : state.deleted--;
    state.queue.unshift(p);
    if (R === state) showCurrent();
  });
  flash(decision);
  showCurrent();
}

function undo() {
  if (!R || R.history.length === 0) return;
  const state = R;
  const last = state.history.pop();
  last.decision === 'keep' ? state.kept-- : state.deleted--;
  state.queue.unshift(last.path);
  state.chain = state.chain.then(() => post('undo', { path: last.path })).catch((e) => toast('Undo failed: ' + e.message));
  showCurrent();
}

function flash(decision) {
  const stage = document.getElementById('stage');
  if (!stage) return;
  const f = document.createElement('div');
  f.className = 'flash';
  f.style.background = decision === 'keep' ? 'rgba(47,166,106,.35)' : 'rgba(214,69,80,.35)';
  stage.appendChild(f);
  requestAnimationFrame(() => { f.style.opacity = 1; setTimeout(() => f.remove(), 180); });
}

function attachSwipe(el) {
  let x0 = null, y0 = null;
  el.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 1.5) decide(dx > 0 ? 'keep' : 'delete');
  });
}

/* ---------- settings ---------- */
const del = (p, body) => api(p, { method: 'DELETE', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });

async function settingsView() {
  cleanupReview();
  $app.innerHTML = '<p class="muted">Loading…</p>';
  let s;
  try { s = await api('settings'); }
  catch (e) { $app.innerHTML = `<div class="err">${esc(e.message)}</div><button onclick="route()">Retry</button>`; return; }
  CONFIG.deleteMode = s.deleteMode;

  $app.innerHTML = `
    <div class="crumbs"><a id="back">← Folders</a></div>
    <h2 style="margin:0 0 12px">Settings</h2>

    <section class="card">
      <h3>When you press Delete</h3>
      <label class="opt"><input type="radio" name="mode" value="mark" ${s.deleteMode === 'mark' ? 'checked' : ''}>
        <span><b>Mark only</b> (recommended)<br><span class="muted small">Adds the photo to the delete list. Nothing on the drive changes, so a read-only share works.</span></span></label>
      <label class="opt"><input type="radio" name="mode" value="move" ${s.deleteMode === 'move' ? 'checked' : ''}>
        <span><b>Move to _trash</b><br><span class="muted small">Also moves the file into a <code>_trash</code> folder on the share. Never permanently deletes. Needs write access to the share.</span></span></label>
      <div class="bar"><button class="primary" id="savemode">Save</button><span id="modemsg" class="muted small"></span></div>
    </section>

    <section class="card">
      <h3>Apply marked deletions</h3>
      <p class="muted" id="pendingtxt"></p>
      <div class="bar"><button id="apply"></button></div>
      <div id="applystatus" class="small"></div>
    </section>

    <section class="card">
      <h3>Network shares</h3>
      <div id="shares"><p class="muted">Loading…</p></div>
    </section>`;
  document.getElementById('back').onclick = () => go('browse', '');

  // -- delete behaviour --
  document.getElementById('savemode').onclick = async () => {
    const mode = document.querySelector('input[name=mode]:checked').value;
    if (mode === s.deleteMode) { document.getElementById('modemsg').textContent = 'No change.'; return; }
    if (mode === 'move' && !confirm('From now on, Delete will move photos into a _trash folder on the share (never permanent). The share needs write access. Continue?')) return;
    try {
      await post('settings', { deleteMode: mode });
      s.deleteMode = mode; CONFIG.deleteMode = mode;
      document.getElementById('modemsg').textContent = 'Saved.';
    } catch (e) { toast('Could not save: ' + e.message); }
  };

  // -- apply marked --
  const paintPending = () => {
    document.getElementById('pendingtxt').textContent = s.pendingMove
      ? `${s.pendingMove} photo${s.pendingMove === 1 ? ' is' : 's are'} marked for deletion and still on the drive.`
      : 'No marked photos are waiting on the drive.';
    const b = document.getElementById('apply');
    b.textContent = `Move ${s.pendingMove} marked photo${s.pendingMove === 1 ? '' : 's'} to _trash`;
    b.disabled = !s.pendingMove;
  };
  paintPending();
  document.getElementById('apply').onclick = async () => {
    if (!confirm(`Move ${s.pendingMove} marked photos into _trash on the share? They are not permanently deleted, and you can restore them from the delete list. The share needs write access.`)) return;
    const b = document.getElementById('apply'), st = document.getElementById('applystatus');
    b.disabled = true;
    let after = '', moved = 0; const failed = [];
    try {
      for (;;) {
        const r = await post('apply', { after });
        moved += r.moved; failed.push(...r.failed); after = r.last;
        st.textContent = `Moved ${moved}…`;
        if (r.done) break;
      }
    } catch (e) { toast('Stopped: ' + e.message); }
    st.innerHTML = `Moved ${moved} photo${moved === 1 ? '' : 's'} to _trash.` +
      (failed.length ? ` <span style="color:#e07a84">${failed.length} failed</span> (first error: ${esc(failed[0].error)}).` : '');
    try { s = { ...s, ...(await api('settings')) }; } catch {}
    paintPending();
  };

  // -- network shares --
  loadShares();
}

async function loadShares() {
  const box = document.getElementById('shares');
  let d;
  try { d = await api('shares'); }
  catch (e) { box.innerHTML = `<div class="note">${esc(e.message)}</div>`; return; }

  box.innerHTML = `
    <div class="list">${d.shares.map((sh) => `
      <div class="row" style="cursor:default" data-n="${esc(sh.name)}">
        <span class="name"><b>${esc(sh.name)}</b><br><span class="muted small">${esc(sh.path)}${sh.exists ? '' : ' · folder missing'}</span></span>
        <button class="rm">Remove</button></div>`).join('')}</div>
    <p class="muted small">Removing a share only stops the app from showing it. Your files aren't touched, and review progress is kept in case you add it back.</p>
    <h4 style="margin:14px 0 6px">Add a share</h4>
    <p class="muted small">The drive must already be mounted on the server (inside <code>${esc(d.base)}</code>). Pick a folder below.</p>
    <div class="bar"><input id="sname" placeholder="Name shown in the app"><input id="spath" placeholder="${esc(d.base)}/…" value="${esc(d.base)}">
      <button id="sbrowse">Browse</button><button class="primary" id="sadd">Add</button></div>
    <div id="sbrowser"></div>`;

  box.querySelectorAll('.rm').forEach((b) => b.addEventListener('click', async () => {
    const name = b.closest('.row').dataset.n;
    if (!confirm(`Remove the share “${name}” from the app? Your files are not touched.`)) return;
    try { await del('shares', { name }); loadShares(); } catch (e) { toast(e.message); }
  }));

  const browse = async (dir) => {
    const out = document.getElementById('sbrowser');
    try {
      const r = await api('shares/browse?dir=' + encodeURIComponent(dir));
      document.getElementById('spath').value = r.path;
      out.innerHTML = '<div class="list">' + (r.parent ? '<div class="row" data-d="' + esc(r.parent) + '">⬆ ..</div>' : '') +
        (r.dirs.map((n) => `<div class="row" data-d="${esc(r.path + '/' + n)}">📁 ${esc(n)}</div>`).join('') || '<p class="muted small">No subfolders.</p>') + '</div>';
      out.querySelectorAll('[data-d]').forEach((el) => el.addEventListener('click', () => {
        const nm = document.getElementById('sname');
        if (!nm.value || nm.dataset.auto) { nm.value = el.dataset.d.split('/').pop(); nm.dataset.auto = '1'; }
        browse(el.dataset.d);
      }));
    } catch (e) { out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  document.getElementById('sname').addEventListener('input', (e) => delete e.target.dataset.auto);
  document.getElementById('sbrowse').onclick = () => browse(document.getElementById('spath').value);
  document.getElementById('sadd').onclick = async () => {
    const name = document.getElementById('sname').value.trim(), p = document.getElementById('spath').value.trim();
    if (!name) return toast('Enter a name for the share.');
    try { await post('shares', { name, path: p }); loadShares(); } catch (e) { toast(e.message); }
  };
  browse(d.base);
}

/* ---------- delete list ---------- */
const PAGE = 60;

async function markedView(path) {
  cleanupReview();
  $app.innerHTML = '<p class="muted">Loading…</p>';
  let total = 0, offset = 0;
  const scope = path ? ` in ${esc(path)}` : '';
  const csvHref = '/api/marked.csv?' + q(path);

  const rowHtml = (it) => {
    const i = it.path.lastIndexOf('/');
    const folder = i >= 0 ? it.path.slice(0, i) : '';
    const name = it.path.slice(i + 1);
    const when = new Date(it.decidedAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
    return `<div class="mrow" data-p="${esc(it.path)}">
      <a href="${imgUrl(it.path)}" target="_blank" rel="noopener"><img loading="lazy" alt="" src="/api/img?w=200&${q(it.path)}"></a>
      <div class="minfo"><div class="mname">${esc(name)}</div>
        <div class="muted small">${esc(folder || 'Root')} · ${esc(when)}${it.moved ? ' · moved to _trash' : ''}</div></div>
      <button class="unmark">${it.moved ? 'Restore' : 'Unmark'}</button></div>`;
  };

  const draw = (items, append) => {
    const list = document.getElementById('mlist');
    if (!append) list.innerHTML = '';
    list.insertAdjacentHTML('beforeend', items.map(rowHtml).join(''));
    document.getElementById('mcount').textContent = total + ' photo' + (total === 1 ? '' : 's');
    document.getElementById('more').style.display = offset < total ? '' : 'none';
    document.getElementById('empty').style.display = total === 0 ? '' : 'none';
  };

  const load = async (append) => {
    const d = await api(`marked?${q(path)}&limit=${PAGE}&offset=${offset}`);
    total = d.total;
    offset += d.items.length;
    draw(d.items, append);
  };

  $app.innerHTML = `
    <div class="crumbs"><a id="back">← Folders</a></div>
    <h2 style="margin:0 0 4px">Delete list${scope}</h2>
    <p class="muted" style="margin:0 0 12px"><span id="mcount"></span> ·
      <a href="${csvHref}" style="color:var(--accent)">Download CSV</a></p>
    <div id="empty" class="muted" style="display:none">Nothing marked for deletion.</div>
    <div id="mlist"></div>
    <div class="bar" style="margin-top:12px"><button id="more" style="display:none">Load more</button></div>`;
  document.getElementById('back').onclick = () => go('browse', path);
  document.getElementById('more').onclick = () => load(true).catch((e) => toast(e.message));
  document.getElementById('mlist').addEventListener('click', async (e) => {
    const btn = e.target.closest('.unmark');
    if (!btn) return;
    const row = btn.closest('.mrow');
    btn.disabled = true;
    try {
      await post('undo', { path: row.dataset.p });
      row.remove();
      total--; offset--;
      document.getElementById('mcount').textContent = total + ' photo' + (total === 1 ? '' : 's');
      if (total === 0) document.getElementById('empty').style.display = '';
    } catch (err) { btn.disabled = false; toast('Could not undo: ' + err.message); }
  });
  try { await load(false); }
  catch (e) { $app.innerHTML = `<div class="err">${esc(e.message)}</div><button onclick="route()">Retry</button>`; }
}

route();
</script>
</body>
</html>
